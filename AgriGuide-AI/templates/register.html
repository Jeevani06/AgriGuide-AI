{% extends "base.html" %}{% block content %}<h3>Register</h3>
<form method="post" class="col-md-4"><input class="form-control mb-2" name="name" placeholder="Name" required>
<input class="form-control mb-2" name="email" type="email" placeholder="Email" required>
<input class="form-control mb-2" name="password" type="password" placeholder="Password" required>
<button class="btn btn-success">Create account</button></form>{% endblock %}
