<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriGuide-AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}</head><body>
<nav class="navbar navbar-expand navbar-dark bg-success px-3"><a class="navbar-brand" href="/">🌾 AgriGuide-AI</a>
{% if current_user.is_authenticated %}<div class="navbar-nav">
<a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
<a class="nav-link" href="{{ url_for('recommend.recommend') }}">Recommend</a>
<a class="nav-link" href="{{ url_for('monitor.monitor') }}">Monitor</a>
<a class="nav-link" href="{{ url_for('yield_pred.predict') }}">Yield</a>
<a class="nav-link" href="{{ url_for('main.history') }}">History</a>
<a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a></div>{% endif %}</nav>
<main class="container py-4">
{% for c, m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
